name: Android core (3D)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: 27.2.12479018
      - name: Compilar (ndk-build, todas as ABIs)
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cd jni
          "$NDK/ndk-build" -j"$(nproc)" APP_PLATFORM=android-24 APP_ABI="arm64-v8a armeabi-v7a x86_64"
      - name: Empacotar
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a out/x86_64
          for a in arm64-v8a armeabi-v7a x86_64; do
            cp libs/$a/libretro.so out/$a/fceumm_3d_libretro_android.so
          done
          cp fceumm_3d_libretro.info out/
      - uses: actions/upload-artifact@v4
        with:
          name: fceumm_3d_libretro_android
          path: out
